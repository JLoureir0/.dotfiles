# Colors (Monokai Pro)
colors:
  # Default colors
  primary:
    background: '0x2D2A2E'
    foreground: '0xfff1f3'

  # Normal colors
  normal:
    black:   '0x2c2525'
    red:     '0xfd6883'
    green:   '0xadda78'
    yellow:  '0xf9cc6c'
    blue:    '0xf38d70'
    magenta: '0xa8a9eb'
    cyan:    '0x85dacc'
    white:   '0xfff1f3'

  # Bright colors
  bright:
    black:   '0x72696a'
    red:     '0xfd6883'
    green:   '0xadda78'
    yellow:  '0xf9cc6c'
    blue:    '0xf38d70'
    magenta: '0xa8a9eb'
    cyan:    '0x85dacc'
    white:   '0xfff1f3'

# Font configuration
font:
  size: 19
  normal:
    family: CaskaydiaCove Nerd Font Mono
    style: Bold

  # The bold font face
  bold:
    family: CaskaydiaCove Nerd Font Mono
    style: Bold

  italic:
    family: CaskaydiaCove Nerd Font Mono
    style: Italic

window:
  #startup_mode: SimpleFullScreen
  startup_mode: Maximized
  decorations: None

# Send ESC (\x1b) before characters when alt is pressed.
  option_as_alt: Both
